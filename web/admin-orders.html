<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baylos · Kelola Pesanan</title><style>:root{font-family:system-ui,sans-serif;color:#19283e;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#142846;color:white;padding:22px}main{max-width:950px;margin:auto;padding:18px}a{color:inherit}button,input{font:inherit;border-radius:9px;padding:10px}button{background:#2457a6;color:white;border:0;cursor:pointer}input{width:100%;border:1px solid #bbc5d4}.notice,.order{background:white;border:1px solid #dae2ec;border-radius:12px;padding:16px;margin:14px 0}.error{background:#ffe7e7;color:#8a1616}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badges span{background:#e6edf9;padding:5px 8px;border-radius:20px;font-size:.85rem}.total{font-weight:700}small{overflow-wrap:anywhere} .toolbar{display:flex;gap:12px;align-items:center} .toolbar input{flex:1} .toolbar button{white-space:nowrap}select{font:inherit;padding:10px;border:1px solid #bbc5d4;border-radius:9px;background:white}label{display:block;margin:8px 0}dialog::backdrop{background:#0b142acc}dialog input{margin-top:5px} .order button{margin:4px 6px 4px 0} </style><link rel="stylesheet" href="baylos-premium-theme.css"></head><body><header><h1>Baylos · Kelola Pesanan</h1><p>Admin Command Center · Riwayat pesanan dan pengiriman</p><a href="admin-inventory.html">← Kelola produk</a><nav style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px"><a href="admin-dashboard.html">✦ Dashboard</a><a href="admin-inventory.html">Produk</a><a href="admin-orders.html">Pesanan</a><a href="../index.html">Marketplace</a><a href="admin-chat.html">Chat pelanggan</a></nav></header><main><div id="status" class="notice" role="status">Memeriksa akses admin…</div><section id="workspace" hidden><div class="toolbar"><input id="filter" type="search" aria-label="Cari pesanan" placeholder="Cari ID, nama, telepon, status"><button id="reload">Muat ulang</button><button id="export" type="button" disabled>Ekspor CSV</button></div><div class="order-tools" style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0"><label>Status pesanan <select id="statusFilter"><option value="">Semua</option><option>pending</option><option>paid</option><option>processing</option><option>shipped</option><option>completed</option><option>cancelled</option></select></label><label>Status pembayaran <select id="paymentFilter"><option value="">Semua</option><option>unpaid</option><option>pending_verification</option><option>paid</option><option>failed</option><option>refunded</option></select></label></div><p id="count"></p><div id="orders"></div>
<dialog id="orderDialog" style="width:min(680px,94vw);border:1px solid #d9e0e8;border-radius:16px;padding:22px"><form id="shipmentForm"><h2>Catatan pengiriman</h2><p id="dialogOrderId"></p><label>Kurir <input id="draftCourier" maxlength="80" placeholder="Contoh: JNE"></label><label>Layanan <input id="draftService" maxlength="80" placeholder="Contoh: REG"></label><label>Nomor resi <input id="draftTracking" maxlength="120" placeholder="Nomor resi"></label><p class="notice">Mode persiapan: catatan ini hanya disimpan sebagai draf di browser ini, belum dikirim ke database.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="submit">Simpan draf lokal</button><button type="button" id="closeDialog">Tutup</button><button type="button" id="printOrder">Cetak daftar pesanan</button></div><p id="draftMessage" role="status"></p></form></dialog></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="baylos-supabase-config.js"></script><script src="baylos-supabase.js"></script><script src="admin-orders.js"></script></body></html>
