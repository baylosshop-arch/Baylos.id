<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baylos · Chat pelanggan</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f8f5f1;color:#29221e}header{background:#211b19;color:white;padding:18px}main{max-width:1000px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(220px, .8fr) minmax(280px,1.2fr);gap:14px}.panel{background:white;border:1px solid #eadfd6;border-radius:14px;padding:14px;min-width:0}button,input,textarea{font:inherit;border-radius:9px;padding:10px}button{background:#5e4032;color:white;border:0;cursor:pointer}input,textarea{width:100%;border:1px solid #cdbeb3}textarea{resize:vertical;min-height:70px}.thread{display:block;width:100%;text-align:left;margin:6px 0;background:#f3ede7;color:#2b211b}.thread.active{outline:2px solid #5e4032}.messages{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px 0}.bubble{padding:10px;border-radius:12px;background:#f0e9e2;max-width:90%;overflow-wrap:anywhere}.bubble.admin{align-self:flex-end;background:#e4efe5}.muted{color:#766b63;font-size:.9rem}.row{display:flex;gap:8px;margin-top:8px}.row button{white-space:nowrap}.status{padding:10px;background:#fff0cc;border-radius:8px;margin:10px 0}@media(max-width:650px){main{grid-template-columns:1fr}.messages{height:38vh}}</style></head><body><header><h1>Baylos · Chat Pelanggan</h1><p>Kelola percakapan pelanggan dan kirim balasan dari satu tempat.</p><a style="color:white" href="admin-dashboard.html">← Dashboard admin</a></header><main><section class="panel"><h2>Inbox percakapan</h2><button id="reload">Muat ulang</button><div id="status" class="status">Memeriksa akses admin…</div><div id="threads"></div></section><section class="panel"><h2 id="title">Ruang percakapan</h2><div id="messages" class="messages"></div><form id="replyForm"><textarea id="reply" maxlength="2000" placeholder="Tulis balasan ke pelanggan…" required></textarea><div class="row"><button type="submit">Kirim balasan</button><button type="button" id="closeThread">Tutup percakapan</button></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="baylos-supabase-config.js"></script><script src="baylos-supabase.js"></script><script>
(()=>{const $=id=>document.getElementById(id);let me=null,selected=null,threads=[];const client=()=>window.BaylosAPI?.client;const say=(s)=>$('status').textContent=s;const esc=s=>String(s||'');async function init(){try{if(!window.BaylosAPI?.ready)throw Error('Konfigurasi Supabase belum siap.');const session=await BaylosAPI.session();if(!session?.user)throw Error('Silakan masuk menggunakan akun admin terlebih dahulu.');me=session.user;const profile=await BaylosAPI.profile();if(profile?.user_role!=='admin')throw Error('Akun ini bukan admin.');say('Akses admin terverifikasi.');$('replyForm').hidden=false;await load()}catch(e){say(e.message);$('replyForm').hidden=true}}async function load(){try{const {data,error}=await client().from('chat_conversations').select('*').order('updated_at',{ascending:false});if(error)throw error;threads=data||[];const box=$('threads');box.replaceChildren();threads.forEach(t=>{const b=document.createElement('button');b.className='thread'+(selected?.id===t.id?' active':'');b.textContent=(t.product_name||'Pertanyaan umum')+' · '+(t.status==='closed'?'Ditutup':'Terbuka')+' · '+new Date(t.updated_at).toLocaleString('id-ID');b.onclick=()=>choose(t);box.append(b)});if(!threads.length)box.textContent='Belum ada chat dari pelanggan.';if(selected){selected=threads.find(t=>t.id===selected.id)||null;if(selected)await loadMessages()}}catch(e){say(e.message||'Gagal memuat percakapan.')}}async function choose(t){selected=t;$('title').textContent=t.product_name+' — '+t.customer_id;await load();await loadMessages()}async function loadMessages(){if(!selected)return;const {data,error}=await client().from('chat_messages').select('*').eq('conversation_id',selected.id).order('created_at');if(error){say(error.message);return}const box=$('messages');box.replaceChildren();(data||[]).forEach(m=>{const b=document.createElement('div');b.className='bubble'+(m.sender_id===me.id?' admin':'');b.textContent=m.message+' · '+new Date(m.created_at).toLocaleString('id-ID');box.append(b)});box.scrollTop=box.scrollHeight} $('replyForm').onsubmit=async e=>{e.preventDefault();if(!selected)return say('Pilih percakapan terlebih dahulu.');const message=$('reply').value.trim();if(!message)return;try{const {error}=await client().from('chat_messages').insert({conversation_id:selected.id,sender_id:me.id,message});if(error)throw error;await client().from('chat_conversations').update({updated_at:new Date().toISOString()}).eq('id',selected.id);$('reply').value='';await load()}catch(e){say(e.message||'Balasan gagal dikirim.')}};$('closeThread').onclick=async()=>{if(!selected)return;const {error}=await client().from('chat_conversations').update({status:'closed',updated_at:new Date().toISOString()}).eq('id',selected.id);if(error)say(error.message);else{say('Percakapan ditutup.');await load()}};$('reload').onclick=load;init()})();</script></body></html>
