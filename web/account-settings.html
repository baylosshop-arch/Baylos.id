<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan Akun · Baylos</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#24211c;background:#faf7ef}*{box-sizing:border-box}body{margin:0}header{background:#141414;color:#efd18b;border-bottom:2px solid #caa45a;padding:16px max(16px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:inherit}nav{display:flex;gap:12px;flex-wrap:wrap}main{max-width:1050px;margin:auto;padding:24px 16px 70px}h1{margin-top:0}.card{background:#fff;border:1px solid #e7dcc4;border-radius:15px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.muted{color:#756e61}.notice{background:#fff0c9;border-radius:12px;padding:13px;line-height:1.5}button,.btn{background:#191816;color:#f2d797;border:1px solid #caa45a;border-radius:10px;padding:10px 14px;font:inherit;text-decoration:none;cursor:pointer}button.secondary{background:#fff;color:#29251e}button:disabled{opacity:.5}input,select,textarea{font:inherit;padding:10px;border:1px solid #cfc4b1;border-radius:9px;width:100%;margin:5px 0 12px}label{display:block}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee5d5} .tablewrap{overflow:auto} .empty{padding:18px;text-align:center;color:#756e61} [hidden]{display:none!important}@media(max-width:600px){header{padding:14px}main{padding:18px 12px 60px}.card{padding:14px}th,td{padding:8px;font-size:.9rem}}</style></head><body><header><a href="../index.html"><strong>✦ BAYLOS</strong></a><nav><a href="storefront.html">Katalog</a><a href="my-orders.html">Pesanan</a><a href="affiliate-dashboard.html">Afiliasi</a><a href="account-settings.html">Akun</a><a href="help-center.html">Bantuan</a></nav></header><main><p class="muted">BAYLOS · AREA PENGGUNA</p><h1>Profil & Pengaturan Akun</h1><div class="notice" data-mode></div><section class="card"><form id="form"><label>Nama lengkap<input id="name" maxlength="100" autocomplete="name" required></label><label>Nomor telepon<input id="phone" inputmode="tel" maxlength="20" autocomplete="tel"></label><label>Nama tampilan<input id="display" maxlength="60"></label><button>Simpan draf profil</button> <button type="button" class="secondary" id="clear">Kosongkan</button></form><p id="msg" role="status"></p></section><section class="card"><h2>Keamanan akun</h2><p>Perubahan email/kata sandi harus dilakukan melalui autentikasi Supabase resmi. Jangan menyimpan kata sandi dalam localStorage.</p><button id="security" class="secondary">Petunjuk keamanan</button><p id="securityMsg" role="status"></p></section><script>const key='baylos-account-draft';try{const d=JSON.parse(localStorage.getItem(key)||'{}');for(const k of ['name','phone','display'])document.getElementById(k).value=d[k]||''}catch{}document.getElementById('form').onsubmit=e=>{e.preventDefault();const d={name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),display:document.getElementById('display').value.trim()};if(!d.name){document.getElementById('msg').textContent='Nama lengkap wajib diisi.';return}localStorage.setItem(key,JSON.stringify(d));document.getElementById('msg').textContent='Draf profil tersimpan di perangkat ini saja; belum disimpan ke akun/server.'};document.getElementById('clear').onclick=()=>{document.getElementById('form').reset();localStorage.removeItem(key);document.getElementById('msg').textContent='Draf lokal dihapus.'};document.getElementById('security').onclick=()=>document.getElementById('securityMsg').textContent='Gunakan fitur pemulihan resmi; jangan pernah membagikan kata sandi atau service-role key.';</script></main><script src="baylos-stage22-30.js"></script></body></html>
